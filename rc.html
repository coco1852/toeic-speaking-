<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F1">
<title>토익 오답 카드 — 단어 · Part 5·6</title>
<style>
:root{
  --bg:#F3F5F1; --paper:#FFFFFF; --ink:#1A222C; --ink2:#4B5563; --mute:#8A93A0;
  --line:#DCE1DA; --ok:#2E6B4E; --ok-bg:#E6F1EA; --no:#B23F2C; --no-bg:#F8E7E2;
  --tag:#E9ECE6; --sel:#1A222C;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#13171B; --paper:#1D2228; --ink:#EDEFEA; --ink2:#B7BEC8; --mute:#7C858F;
    --line:#2C333B; --ok:#7FC79E; --ok-bg:#1E3328; --no:#E8846F; --no-bg:#3B2420; --tag:#2A3038; --sel:#EDEFEA; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.hide{display:none!important}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;color:var(--mute);border:1px solid transparent}
.tabs button.on{background:var(--paper);color:var(--ink);border-color:var(--line)}
.tabs small{display:block;font-weight:400;font-size:11px;opacity:.75}

/* filters */
.filters{padding:10px 16px 6px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:6px 11px;border-radius:999px;background:var(--tag);color:var(--ink2);font-size:13px;flex:0 0 auto}
.chips button.on{background:var(--sel);color:var(--bg)}
.chips .lab{font-size:12px;color:var(--mute);align-self:center;flex:0 0 auto;padding-right:2px}
.opts{display:flex;gap:6px;align-items:center;justify-content:space-between}
.opts .left{display:flex;gap:6px}
.opts button{padding:6px 11px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--ink2);background:var(--paper)}
.opts button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.count{font-size:13px;color:var(--mute)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}

/* card */
main{padding:6px 16px 16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;min-height:300px;padding:18px 18px 16px;display:flex;flex-direction:column;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:14px}
.meta .src{font-weight:600;letter-spacing:.02em}
.meta .tg{background:var(--tag);color:var(--ink2);padding:2px 8px;border-radius:6px;font-weight:600}
.meta .tg.warn{background:var(--no-bg);color:var(--no)}
.front{flex:1}
.q{font-family:Georgia,"Times New Roman","Noto Serif KR",serif;font-size:21px;line-height:1.5;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.q .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);line-height:.9;margin:0 .1em;vertical-align:baseline}
.q.ko{font-family:inherit;font-size:19px}
.q.word{font-size:26px;font-weight:600;font-family:Georgia,"Times New Roman",serif}
.q.rule{font-family:inherit;font-size:20px;font-weight:600}
.hint{margin-top:14px;font-size:13px;color:var(--mute)}
.choices{display:flex;gap:8px;margin-top:18px}
.choices button{flex:1;padding:12px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-family:Georgia,serif;font-size:17px;color:var(--ink)}
.choices button.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.choices button.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no);text-decoration:line-through}
.back{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.ans{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ans .letter{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;font-size:14px;flex:0 0 auto}
.ans .word{font-family:Georgia,serif;font-size:22px;color:var(--ok);font-weight:600}
.ans .mine{font-size:13px;color:var(--no);text-decoration:line-through;font-family:Georgia,serif}
.exp{font-size:15px;color:var(--ink2);line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.exp .ko{display:block;font-size:20px;color:var(--ink);font-weight:600;margin-bottom:6px}
.exp .src{display:block;margin-top:8px;font-size:12px;color:var(--mute)}
.tapzone{position:absolute;inset:0;border-radius:16px}

/* actions */
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{flex:1;padding:14px 0;border-radius:12px;font-weight:700;font-size:16px;border:1.5px solid var(--line);background:var(--paper)}
.actions .no{color:var(--no);border-color:var(--no)}
.actions .ok{color:var(--ok);border-color:var(--ok)}
.actions .no.on{background:var(--no-bg)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
.nav button{padding:8px 14px;border-radius:8px;color:var(--ink2)}
.nav button:disabled{opacity:.3}
.empty{padding:60px 20px;text-align:center;color:var(--mute);font-size:15px;line-height:1.7}

/* list */
.list{display:flex;flex-direction:column;gap:6px}
.row{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.row .k{font-family:Georgia,serif;font-size:16px;flex:1;word-break:keep-all;overflow-wrap:anywhere}
.row .k.ko{font-family:inherit;font-size:15px;font-weight:600}
.row .v{font-size:13px;color:var(--ink2);flex:1.3;word-break:keep-all;overflow-wrap:anywhere}
.row .s{font-size:11px;color:var(--mute);flex:0 0 auto;text-align:right;line-height:1.3}
.row.miss{border-left:3px solid var(--no)}
footer{padding:8px 16px 24px;font-size:11px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs">
    <button data-tab="cards" class="on">Part 5·6<small id="n-cards"></small></button>
    <button data-tab="rules">규칙<small id="n-rules"></small></button>
    <button data-tab="words">단어<small id="n-words"></small></button>
  </div>
</header>
<div class="filters">
  <div class="chips" id="f1"></div>
  <div class="chips" id="f2"></div>
  <div class="opts">
    <div class="left">
      <button id="b-shuffle">섞기</button>
      <button id="b-miss">모름만</button>
      <button id="b-list">목록</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</div>
<main id="main"></main>
<footer>오답노트 5권(T1–10)·4권(T1–6) 기준 · 갱신 2026-08-28 · 모름 표시는 이 기기에 저장</footer>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const TAGS = ['어형','콜로','어휘','흐름'];
const S = { tab:'cards', book:'all', test:'all', tag:'all', grp:'all', shuffle:false, missOnly:false, list:false, idx:0, flipped:false, picked:null, order:[] };

/* ---- storage (모름) ---- */
let MISS = new Set();
try { MISS = new Set(JSON.parse(localStorage.getItem('toeic_miss')||'[]')); } catch(e){}
function saveMiss(){ try{ localStorage.setItem('toeic_miss', JSON.stringify([...MISS])); }catch(e){} }
function key(it){ return it._k; }

/* ---- prep ---- */
DATA.cards.forEach(c=>{ c._k='c'+c.book+'-'+c.test+'-'+c.num; c._t='cards';
  c.tagMain = TAGS.find(t=>c.tag.includes(t)) || '흐름'; });
DATA.rules.forEach((r,i)=>{ r._k='r'+i+'-'+r.front.slice(0,12); r._t='rules'; });
DATA.words.forEach((w,i)=>{ w._k='w'+i+'-'+w.front.slice(0,16); w._t='words'; });
document.getElementById('n-cards').textContent=DATA.cards.length+'문항';
document.getElementById('n-rules').textContent=DATA.rules.length+'개';
document.getElementById('n-words').textContent=DATA.words.length+'개';

const uniq=a=>[...new Set(a)];
const WORD_GROUPS = uniq(DATA.words.map(w=>w.grp));
const RULE_GROUPS = uniq(DATA.rules.map(r=>r.grp));

function pool(){
  let a;
  if(S.tab==='cards'){
    a=DATA.cards.filter(c=>(S.book==='all'||c.book==S.book)&&(S.test==='all'||c.test==S.test)&&(S.tag==='all'||c.tagMain===S.tag));
  }else if(S.tab==='rules'){
    a=DATA.rules.filter(r=>S.grp==='all'||r.grp===S.grp);
  }else{
    a=DATA.words.filter(w=>S.grp==='all'||w.grp===S.grp);
  }
  if(S.missOnly) a=a.filter(x=>MISS.has(key(x)));
  return a;
}
function rebuildOrder(){
  const p=pool(); S.order=p.map((_,i)=>i);
  if(S.shuffle){ for(let i=S.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.order[i],S.order[j]]=[S.order[j],S.order[i]];} }
  S.idx=0; S.flipped=false; S.picked=null; return p;
}

/* ---- filters UI ---- */
function chip(label,on,fn){ const b=document.createElement('button'); b.textContent=label; if(on)b.classList.add('on'); b.onclick=fn; return b; }
function lab(t){ const s=document.createElement('span'); s.className='lab'; s.textContent=t; return s; }
function renderFilters(){
  const f1=document.getElementById('f1'), f2=document.getElementById('f2'); f1.innerHTML=''; f2.innerHTML='';
  if(S.tab==='cards'){
    f1.append(lab('교재'));
    [['all','전체'],[5,'5권'],[4,'4권']].forEach(([v,l])=>f1.append(chip(l,S.book==v,()=>{S.book=v;S.test='all';go();})));
    f1.append(lab('태그'));
    TAGS.forEach(t=>f1.append(chip(t,S.tag===t,()=>{S.tag=S.tag===t?'all':t;go();})));
    f2.append(lab('회차'));
    const tests = S.book==='all' ? [] : uniq(DATA.cards.filter(c=>c.book==S.book).map(c=>c.test));
    if(S.book==='all'){ f2.append(chip('교재를 고르면 회차 선택',false,()=>{})); }
    else { f2.append(chip('전체',S.test==='all',()=>{S.test='all';go();})); tests.forEach(t=>f2.append(chip('T'+t,S.test==t,()=>{S.test=t;go();}))); }
  }else{
    const groups = S.tab==='rules'?RULE_GROUPS:WORD_GROUPS;
    f1.append(lab('그룹')); f1.append(chip('전체',S.grp==='all',()=>{S.grp='all';go();}));
    groups.forEach(g=>f1.append(chip(g,S.grp===g,()=>{S.grp=g;go();})));
    f2.classList.add('hide'); return;
  }
  f2.classList.remove('hide');
  document.getElementById('b-shuffle').classList.toggle('on',S.shuffle);
  document.getElementById('b-miss').classList.toggle('on',S.missOnly);
  document.getElementById('b-list').classList.toggle('on',S.list);
}

/* ---- render ---- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function blanks(s){ return esc(s).replace(/_{3,}/g,'<span class="blank"></span>'); }
function srcOf(it){
  if(it._t==='cards') return it.book+'권 T'+it.test+' · '+it.num+'번';
  if(it._t==='rules') return it.grp;
  return it.grp;
}
function letterOf(ans){ const m=ans.match(/^\(([A-D])\)\s*(.*)$/); return m?[m[1],m[2]]:['',ans]; }

function renderMain(){
  const p=pool(); const main=document.getElementById('main');
  document.getElementById('count').innerHTML = p.length? `<b>${S.list?p.length:(S.idx+1)}</b> / ${p.length}` : '<b>0</b>';
  if(!p.length){ main.innerHTML='<div class="empty">조건에 맞는 카드가 없어.<br>필터나 "모름만"을 풀어봐.</div>'; return; }
  if(S.list){ renderList(p); return; }
  const it=p[S.order[S.idx]]; const miss=MISS.has(key(it));
  let front='', back='', tagHtml='';
  if(it._t==='cards'){
    tagHtml=`<span class="tg${it.flag?' warn':''}">${esc(it.tag)}${it.flag?' ⚠답 바꿈':''}</span>`;
    const isEn=/[A-Za-z]/.test(it.front);
    front=`<div class="q${isEn?'':' ko'}">${blanks(it.front)}</div>`;
    if(it.book===4 && it.mine && it.mine!=='미응답' && !it.mine.includes('미응답')){
      const [la,wa]=letterOf(it.ans), [lm,wm]=letterOf(it.mine);
      const opts=[[la,wa,true],[lm,wm,false]]; if(it._sw==null) it._sw=Math.random()<.5; if(it._sw) opts.reverse();
      front+=`<div class="choices">${opts.map(o=>`<button data-ok="${o[2]}" class="${S.picked!=null?(o[2]?'right':'wrong'):''}">${esc(o[1]||o[0])}</button>`).join('')}</div>`;
      front+=`<div class="hint">${S.picked==null?'둘 중 하나가 내가 고른 오답':''}</div>`;
    } else {
      front+=`<div class="hint">${S.flipped?'':'탭해서 정답 · 근거 보기'}${it.mine.includes('미응답')?' · 실전에서 미응답':''}</div>`;
    }
    const [la,wa]=letterOf(it.ans);
    back=`<div class="ans">${la?`<span class="letter">${la}</span>`:''}<span class="word">${esc(wa||'')}</span>${it.mine&&it.book===4?`<span class="mine">내 답 ${esc(it.mine)}</span>`:''}</div>
          <div class="exp">${esc(it.back)}</div>`;
  } else if(it._t==='rules'){
    front=`<div class="q rule">${esc(it.front)}</div><div class="hint">${S.flipped?'':'탭해서 예시 · 출처 보기'}</div>`;
    back=`<div class="exp">${it.back?esc(it.back):'<i>규칙을 소리 내 말한 뒤 넘기기</i>'}<span class="src">${esc(it.src)}</span></div>`;
  } else {
    front=`<div class="q word">${esc(it.front)}</div><div class="hint">${S.flipped?'':'탭해서 뜻 보기'}</div>`;
    back=`<div class="exp"><span class="ko">${esc(it.back)}</span>${it.note?esc(it.note):''}</div>`;
  }
  main.innerHTML=`
    <div class="card" id="card">
      <div class="meta"><span class="src">${esc(srcOf(it))}</span>${tagHtml}</div>
      <div class="front">${front}</div>
      <div class="back ${S.flipped?'':'hide'}">${back}</div>
    </div>
    <div class="actions">
      <button class="no ${miss?'on':''}" id="b-no">${miss?'모름 ✓':'모름'}</button>
      <button class="ok" id="b-ok">알아요 →</button>
    </div>
    <div class="nav"><button id="b-prev" ${S.idx===0?'disabled':''}>← 이전</button><span>${S.shuffle?'섞음':'순서'}${S.missOnly?' · 모름만':''}</span><button id="b-next" ${S.idx>=p.length-1?'disabled':''}>다음 →</button></div>`;
  const card=document.getElementById('card');
  card.onclick=e=>{ if(e.target.closest('.choices')) return; S.flipped=!S.flipped; renderMain(); };
  main.querySelectorAll('.choices button').forEach(b=>b.onclick=e=>{ e.stopPropagation(); if(S.picked!=null)return; S.picked=b.dataset.ok==='true'; S.flipped=true; if(!S.picked){MISS.add(key(it));saveMiss();} renderMain(); });
  document.getElementById('b-no').onclick=()=>{ if(miss)MISS.delete(key(it)); else MISS.add(key(it)); saveMiss(); next(p); };
  document.getElementById('b-ok').onclick=()=>{ MISS.delete(key(it)); saveMiss(); next(p); };
  document.getElementById('b-prev').onclick=()=>{ if(S.idx>0){S.idx--;S.flipped=false;S.picked=null;renderMain();} };
  document.getElementById('b-next').onclick=()=>next(p);
}
function next(p){ if(S.idx<p.length-1){S.idx++;S.flipped=false;S.picked=null;renderMain();window.scrollTo({top:0});} else { S.flipped=false; S.picked=null; renderMain(); document.getElementById('count').innerHTML+=' · 끝'; } }

function renderList(p){
  const main=document.getElementById('main');
  main.innerHTML='<div class="list">'+p.map(it=>{
    const miss=MISS.has(key(it));
    if(it._t==='cards'){ const [la,wa]=letterOf(it.ans); return `<div class="row ${miss?'miss':''}"><div class="k${/[A-Za-z]/.test(it.front)?'':' ko'}">${blanks(it.front)}</div><div class="v"><b>${esc(wa||la)}</b> · ${esc(it.tag)}</div><div class="s">${it.book}권 T${it.test}<br>${it.num}</div></div>`; }
    if(it._t==='rules') return `<div class="row ${miss?'miss':''}"><div class="k ko">${esc(it.front)}</div><div class="v">${esc(it.back)}</div><div class="s">${esc(it.src)}</div></div>`;
    return `<div class="row ${miss?'miss':''}"><div class="k">${esc(it.front)}</div><div class="v">${esc(it.back)}</div><div class="s">${esc(it.grp)}</div></div>`;
  }).join('')+'</div>';
}

function go(){ renderFilters(); rebuildOrder(); renderMain(); window.scrollTo({top:0}); }
document.getElementById('tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; S.tab=b.dataset.tab; S.grp='all'; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); go(); };
document.getElementById('b-shuffle').onclick=()=>{S.shuffle=!S.shuffle;go();};
document.getElementById('b-miss').onclick=()=>{S.missOnly=!S.missOnly;go();};
document.getElementById('b-list').onclick=()=>{S.list=!S.list;renderFilters();renderMain();};
go();
</script>
</body>
</html>
