<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F5F1">
<title>토익 단어 퀴즈 — 4지선다</title>
<style>
:root{ --bg:#F3F5F1; --paper:#FFF; --ink:#1A222C; --ink2:#4B5563; --mute:#8A93A0;
  --line:#DCE1DA; --ok:#2E6B4E; --ok-bg:#E6F1EA; --no:#B23F2C; --no-bg:#F8E7E2; --tag:#E9ECE6; --sel:#1A222C; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#13171B; --paper:#1D2228; --ink:#EDEFEA; --ink2:#B7BEC8; --mute:#7C858F;
    --line:#2C333B; --ok:#7FC79E; --ok-bg:#1E3328; --no:#E8846F; --no-bg:#3B2420; --tag:#2A3038; --sel:#EDEFEA; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1{font-size:20px;margin:18px 2px 4px}
.sub{color:var(--mute);font-size:13px;margin:0 2px 18px}
.sec{font-size:12px;color:var(--mute);margin:16px 2px 8px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 14px;border-radius:999px;background:var(--tag);color:var(--ink2);font-size:14px}
.chips button.on{background:var(--sel);color:var(--bg);font-weight:600}
.start{margin-top:24px;width:100%;padding:16px 0;border-radius:14px;background:var(--ok);color:#fff;font-size:17px;font-weight:700}
.start:disabled{opacity:.4}
.ghost{margin-top:10px;width:100%;padding:14px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);font-weight:600}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 10px;font-size:13px;color:var(--mute)}
.top b{color:var(--ink);font-variant-numeric:tabular-nums}
.top .quit{color:var(--mute);padding:4px 8px}
.bar{height:4px;background:var(--tag);border-radius:2px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 18px;text-align:center;margin-bottom:14px}
.qword{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:600;word-break:keep-all;overflow-wrap:anywhere;line-height:1.3}
.qgrp{font-size:12px;color:var(--mute);margin-top:8px}
.opts{display:flex;flex-direction:column;gap:9px}
.opts button{text-align:left;padding:14px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:15.5px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere;transition:background .12s}
.opts button .n{color:var(--mute);font-weight:600;margin-right:8px}
.opts button.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opts button.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.opts button.dim{opacity:.5}
.note{margin-top:12px;background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink2);word-break:keep-all}
.note b{color:var(--ink)}
.nextbtn{margin-top:12px;width:100%;padding:15px 0;border-radius:12px;background:var(--sel);color:var(--bg);font-weight:700;font-size:16px}

/* result */
.score{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 18px;text-align:center;margin:16px 0 14px}
.score .big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.score .big small{font-size:20px;color:var(--mute);font-weight:600}
.score .msg{color:var(--ink2);font-size:14px;margin-top:4px}
.wrongs{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.wr{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--no);border-radius:10px;padding:10px 12px}
.wr .w{font-family:Georgia,serif;font-size:17px;font-weight:600}
.wr .m{font-size:14px;color:var(--ok);margin-top:2px}
.wr .p{font-size:12px;color:var(--no);margin-top:2px}
.wr .nt{font-size:12px;color:var(--mute);margin-top:2px}
</style>
</head>

가 단어", "front": "expert", "back": "(형) 전문적인·숙련된", "note": "expert advice — 명사뿐 아니라 형용사로도 출제", "b": "추가"}, {"grp": "추가 단어", "front": "brighten", "back": "(동) 밝게 하다", "note": "-en = 동사화 (bright+en)", "b": "추가"}, {"grp": "추가 단어", "front": "shorten", "back": "(동) 짧게 하다·단축하다", "note": "-en = 동사화 (short+en)", "b": "추가"}, {"grp": "추가 단어", "front": "by + 시점", "back": "완료 — ~까지 (마감)", "note": "submit by Friday = 금요일까지 제출 완료", "b": "추가"}, {"grp": "추가 단어", "front": "until + 시점", "back": "지속 — ~까지 계속", "note": "open until 9 P.M. = 9시까지 계속 영업. 완료는 by", "b": "추가"}, {"grp": "추가 단어", "front": "initiative", "back": "(명) 계획·사업", "note": "= project. 동사 아님", "b": "추가"}, {"grp": "추가 단어", "front": "in recognition of", "back": "~을 인정하여·~의 공로로", "note": "in recognition of her service", "b": "추가"}, {"grp": "추가 단어", "front": "instability", "back": "불안정(성)", "note": "market instability. ↔ stability", "b": "추가"}, {"grp": "추가 단어", "front": "temper", "back": "(동) 완화하다 / (명) 성질·화", "note": "temper expectations = 기대를 낮추다", "b": "추가"}, {"grp": "추가 단어", "front": "volatility", "back": "변동성·불안정성", "note": "market volatility. volatile(형) 변덕스러운", "b": "추가"}, {"grp": "추가 단어", "front": "vulnerability", "back": "취약성·약점", "note": "vulnerable(형) 취약한", "b": "추가"}, {"grp": "추가 단어", "front": "compatible", "back": "호환되는·양립하는", "note": "compatible with ~ (with 고정)", "b": "추가"}, {"grp": "추가 단어", "front": "stringent", "back": "엄격한", "note": "stringent regulations/requirements = strict", "b": "추가"}]</script>
<script>
const ALL = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const S = { scope:'all', n:20, quiz:null };
let LAST_WRONG = [];
try{ LAST_WRONG = JSON.parse(localStorage.getItem('voca_wrong')||'[]'); }catch(e){}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const poolOf=()=>ALL.filter(w=>S.scope==='all'||w.b===S.scope);

function home(){
  const p=poolOf();
  const wrongSet=new Set(LAST_WRONG);
  const wrongPool=ALL.filter(w=>wrongSet.has(w.front));
  app.innerHTML=`
    <h1>단어 퀴즈</h1>
    <p class="sub">4지선다 · 매번 랜덤 출제 · 총 ${ALL.length}개 (4권+5권+추가)</p>
    <div class="sec">범위</div>
    <div class="chips" id="scope">
      ${[['all','전체'],['4권','4권'],['5권','5권'],['추가','추가 단어']].map(([v,l])=>`<button data-v="${v}" class="${S.scope===v?'on':''}">${l}</button>`).join('')}
    </div>
    <div class="sec">문제 수</div>
    <div class="chips" id="num">
      ${[10,20,40].map(n=>`<button data-v="${n}" class="${S.n===n?'on':''}">${n}개</button>`).join('')}
    </div>
    <button class="start" id="go" ${p.length<4?'disabled':''}>시험 시작 (${Math.min(S.n,p.length)}문제)</button>
    ${wrongPool.length>=1?`<button class="ghost" id="retry">지난 오답 다시 풀기 (${wrongPool.length}개)</button>`:''}
  `;
  document.getElementById('scope').onclick=e=>{const b=e.target.closest('button');if(b){S.scope=b.dataset.v;home();}};
  document.getElementById('num').onclick=e=>{const b=e.target.closest('button');if(b){S.n=+b.dataset.v;home();}};
  document.getElementById('go').onclick=()=>startQuiz(shuf(p).slice(0,Math.min(S.n,p.length)));
  const r=document.getElementById('retry'); if(r) r.onclick=()=>startQuiz(shuf(wrongPool).slice(0,Math.min(40,wrongPool.length)));
}

function distractors(item){
  const same=ALL.filter(w=>w!==item&&w.b===item.b&&w.back!==item.back);
  const rest=ALL.filter(w=>w!==item&&w.back!==item.back);
  const pick=[]; const used=new Set([item.back]);
  for(const src of [shuf(same),shuf(rest)]){
    for(const w of src){ if(pick.length===3)break; if(used.has(w.back))continue; used.add(w.back); pick.push(w.back); }
    if(pick.length===3)break;
  }
  return pick;
}
function startQuiz(items){
  S.quiz={ items, i:0, right:0, wrong:[], locked:false,
    qs: items.map(it=>({it, opts: shuf([it.back, ...distractors(it)])})) };
  question();
}
function question(){
  const Q=S.quiz, q=Q.qs[Q.i];
  app.innerHTML=`
    <div class="top"><span><b>${Q.i+1}</b> / ${Q.qs.length}</span><span>맞음 ${Q.right}</span><button class="quit" id="quit">그만두기</button></div>
    <div class="bar"><i style="width:${(Q.i)/Q.qs.length*100}%"></i></div>
    <div class="qcard"><div class="qword">${esc(q.it.front)}</div><div class="qgrp">${esc(q.it.grp)}</div></div>
    <div class="opts" id="opts">
      ${q.opts.map((o,i)=>`<button data-i="${i}"><span class="n">${i+1}</span>${esc(o)}</button>`).join('')}
    </div>
    <div id="after"></div>`;
  document.getElementById('quit').onclick=()=>{ if(Q.i>0||confirm) finish(true); };
  document.getElementById('opts').onclick=e=>{
    const b=e.target.closest('button'); if(!b||Q.locked)return; Q.locked=true;
    const picked=q.opts[+b.dataset.i], ok=picked===q.it.back;
    document.querySelectorAll('#opts button').forEach((x,i)=>{
      const o=q.opts[i];
      if(o===q.it.back)x.classList.add('right');
      else if(o===picked)x.classList.add('wrong');
      else x.classList.add('dim');
    });
    if(ok)Q.right++; else Q.wrong.push({...q.it,picked});
    document.getElementById('after').innerHTML=
      (q.it.note?`<div class="note"><b>${esc(q.it.front)}</b> — ${esc(q.it.back)}<br>${esc(q.it.note)}</div>`:'')+
      `<button class="nextbtn" id="next">${Q.i<Q.qs.length-1?'다음 →':'결과 보기'}</button>`;
    document.getElementById('next').onclick=()=>{ Q.locked=false; if(Q.i<Q.qs.length-1){Q.i++;question();window.scrollTo({top:0});} else finish(false); };
    if(ok && !q.it.note){ setTimeout(()=>{ if(Q.locked){ Q.locked=false; if(Q.i<Q.qs.length-1){Q.i++;question();window.scrollTo({top:0});} else finish(false);} },800); }
  };
}
function finish(quit){
  const Q=S.quiz; const total=quit?Q.i+ (Q.locked?1:0):Q.qs.length;
  const done=Math.max(total,Q.right+Q.wrong.length);
  try{ localStorage.setItem('voca_wrong', JSON.stringify([...new Set([...Q.wrong.map(w=>w.front)])])); }catch(e){}
  LAST_WRONG=Q.wrong.map(w=>w.front);
  const pct=done?Math.round(Q.right/done*100):0;
  app.innerHTML=`
    <div class="score">
      <div class="big">${Q.right}<small> / ${done}</small></div>
      <div class="msg">${pct>=90?'거의 다 잡혀 있어':pct>=70?'오답만 한 바퀴 더 돌리면 돼':'틀린 것만 다시 풀기 추천'} (${pct}%)</div>
    </div>
    ${Q.wrong.length?`<div class="sec">틀린 단어 ${Q.wrong.length}개</div><div class="wrongs">${Q.wrong.map(w=>`
      <div class="wr"><div class="w">${esc(w.front)}</div><div class="m">${esc(w.back)}</div><div class="p">내가 고른 것: ${esc(w.picked)}</div>${w.note?`<div class="nt">${esc(w.note)}</div>`:''}</div>`).join('')}</div>
      <button class="start" id="again">틀린 ${Q.wrong.length}개 다시 풀기</button>`:''}
    <button class="ghost" id="new">새 시험</button>`;
  const a=document.getElementById('again'); if(a) a.onclick=()=>startQuiz(shuf(Q.wrong.map(({picked,...w})=>w)));
  document.getElementById('new').onclick=home;
  window.scrollTo({top:0});
}
home();
</script>
</body>
